  - name: "DictysFragments"
    env: "dictys"
    script: "./workflow/run_dictys_fragments_resume.py"
    args:
      - "--fragments"
      - "/mnt/TrueNas/project/chenxufeng/Data/PMID33098772_Cell2020_Skin/0_raw/GSM4156597_skin.late.anagen.atac.fragments.dot.sorted.5col.tsv.gz"

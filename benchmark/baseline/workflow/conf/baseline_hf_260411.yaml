      - "/mnt/TrueNas/project/chenxufeng/Data/PMID33098772_Cell2020_Skin/0_raw/GSM4156597_skin_celltype.txt.gz"
      - "--resume"
      - "true"
      - "--resume-mode"
      - "stage"
      - "--device"
      - "cuda:0"
      - "--threads"
      - "16"

  - name: "SCENICPLUSResume"
    env: "scenicplus"
    script: "./workflow/run_scenicplus_resume.py"
    args:
      - "--region-set-root"
      - "/mnt/TrueNas/project/chenxufeng/Data/PMID33098772_Cell2020_Skin/benchmark/data/scenicplus_region_sets/mouse_skin-hf_benchmark"
      - "--region-set-mode"
      - "lineage_vs_rest"
      - "--region-fdr"
      - "0.05"
      - "--region-min-logfc"
      - "0.0"
      - "--resume"
      - "true"
      - "--resume-mode"
      - "stage"
      - "--threads"
      - "16"
      - "--ext"
      - "50000"
  # Final network is written directly from TF_to_gene output (`tg_adj.tsv`).
  # In lineage_vs_rest mode, the script auto-generates:
  #   <region-set-root>/<lineage>/lineage_vs_rest/lineage_vs_rest.bed
